name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            file \
            libfuse2 \
            libgl1 \
            libegl1 \
            libnss3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile and Package AppImage
        run: |
          bash scripts/build_appimage.sh

      - name: Generate SHA256 Checksum
        run: |
          cd dist
          sha256sum D.I.O-x86_64.AppImage > D.I.O-x86_64.AppImage.sha256

      - name: Export Default Preset Package
        run: |
          python3 -m dio.cli export-preset \
            --output dist/dio-default-presets.dio.tar.gz \
            --name "D.I.O. Presets de Fabrica" \
            --description "Configuracion y adaptadores oficiales para ChatGPT, Claude y Gemini"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "D.I.O. ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/D.I.O-x86_64.AppImage
            dist/D.I.O-x86_64.AppImage.sha256
            dist/dio-default-presets.dio.tar.gz
